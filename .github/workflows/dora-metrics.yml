name: Collect DORA metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "dashboard/**"
      - ".github/workflows/dora-metrics.yml"
permissions:
  contents: write
  actions: read
  deployments: read
  issues: read
  pull-requests: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect metrics
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/collect_dora.py
      - name: Publish metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics
          path: dashboard/metrics.json
      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/metrics.json
          git diff --cached --quiet || git commit -m "chore: update DORA metrics [skip ci]"
          git push
