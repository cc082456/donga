name: Pull Request and Deployment Events

on:
  pull_request:
    types: [closed]
  deployment:
  deployment_status:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  calculate-dora-metrics:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.cwd()}/.github/scripts/calculate-dora-metrics.js`);
            await run({ github, context, core });
      - uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: dora-metrics.json
          if-no-files-found: error
          retention-days: 90

  weekly-dora-summary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.cwd()}/.github/scripts/calculate-dora-metrics.js`);
            const { owner, repo } = context.repo;
            const { metrics, summary } = await run({
              github,
              context,
              core,
              windowDays: 7,
              outputFile: 'weekly-dora-metrics.json',
            });
            const startDate = metrics.window.start.slice(0, 10);
            const endDate = metrics.window.end.slice(0, 10);
            const title = `Weekly DORA metrics (${startDate} - ${endDate})`;
            const query = `repo:${owner}/${repo} is:issue in:title "${title}"`;
            const matchingIssues = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              { q: query, per_page: 100 },
            );
            const existingIssue = matchingIssues.find(
              (issue) => issue.title === title,
            );
            const body = [
              summary,
              '',
              `[Download the weekly metrics JSON artifact](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existingIssue.number,
                body,
              });
              core.info(`Updated weekly metrics issue #${existingIssue.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`Created weekly metrics issue #${issue.number}`);
            }
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-dora-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: weekly-dora-metrics.json
          if-no-files-found: error
          retention-days: 90
